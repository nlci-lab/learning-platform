# Test fixture: the Textual Criticism site's Mark 1:2 micro module (src/pages/practice/mark-1-2.astro),
# moved into the data format with its wording unchanged. It becomes the module's real file when that site
# joins the platform (ROADMAP Phase 5). The collation card becomes a named embed the course supplies.
id: mark-1-2
title: "Mark 1:2: “in Isaiah” or “in the prophets”?"
topic: Mark 1:2
question: "“in Isaiah” or “in the prophets”?"
skill: A scribe “corrects” an apparent error
level: 2
minutes: 10
description: "A short guided problem in six steps: a scribe 'corrects' an apparent error in Mark 1:2."
lead: Mark begins with a quotation and names the prophet it comes from. Some manuscripts name Isaiah; others say only “the prophets”. Work out which came first, in the six steps of the worked examples.
sources:
  - id: metzger-ehrman
    cite: Bruce M. Metzger and Bart D. Ehrman, *The Text of the New Testament*, 4th ed. (Oxford University Press, 2005), p. 264.
    checked: true
  - id: cntr
    cite: "Manuscript and edition texts: Alan Bunning, Center for New Testament Restoration, transcriptions, CC BY-SA 4.0."
    checked: true
done: You have worked through Mark 1:2 in the same steps the [worked examples](~/guide/examples/) use. Try [another micro module](~/learn/#modules), or read the [list of doubtful passages](~/guide/doubtful-passages/).
steps:
  - id: find
    title: Find the problem
    body: |
      Καθὼς γέγραπται ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ· Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου …

      “As it is written in Isaiah the prophet: ‘Look, I am sending my messenger ahead of you …’” The words that follow in verses 2–3 join two passages: Malachi 3:1 (“I am sending my messenger”) and Isaiah 40:3 (“a voice of one crying in the wilderness”).
    question:
      id: mark-1-2-find
      type: multichoice
      prompt: What might trouble a careful scribe about the words “in Isaiah the prophet”?
      options:
        - text: The quotation is not only from Isaiah.
          correct: true
          feedback: Right. It begins with Malachi 3:1. Metzger and Ehrman call it a composite quotation from Malachi and Isaiah (p. 264).
        - text: Mark should have named Moses.
          feedback: "No: neither passage is from the books of Moses."
        - text: Gospel writers never name a prophet.
          feedback: "No: the Gospels often name the prophet they quote (Matthew 3:3, for example, names Isaiah)."
  - id: list
    title: List the readings
    body: Here is how the manuscripts in the CNTR transcriptions, and five printed editions, read the verse. Look at the first card.
    embed:
      name: collation
      args: { passage: mark-1-2 }
    question:
      id: mark-1-2-list
      type: multichoice
      prompt: The card shows three Greek forms for the prophet’s name. How many different readings are there in meaning?
      options:
        - text: "Two: “in Isaiah the prophet” and “in the prophets”."
          correct: true
          feedback: Right. Codex Bezae (D) writes “in Isaiah the prophet” without “the” before Isaiah, but the meaning is the same, so it belongs with the first reading. Three forms, two readings.
        - text: Three, because D has no “the”.
          feedback: "Not really: the card shows three forms, but leaving out the article does not change what is said. Count readings by meaning, not by spelling or small words."
        - text: "One: all the witnesses agree."
          feedback: "No: the witnesses do not all agree; some name Isaiah and others say “the prophets”."
  - id: external
    title: External evidence
    body: "Now ask the questions about the witnesses: how old they are, where they come from, and how many."
    question:
      id: mark-1-2-external
      type: multichoice
      prompt: Which reading do the oldest manuscripts here have, Codex Sinaiticus (א) and Codex Vaticanus (B), both from the 4th century?
      options:
        - text: "“in Isaiah the prophet”"
          correct: true
          feedback: "Right. So does Codex Bezae (D, about 400). “In the prophets” is found in A and W (5th century), in the Byzantine text and in the Textus Receptus: later, though more numerous."
        - text: "“in the prophets”"
          feedback: "No: that is the reading of A and W (5th century), the Byzantine text and the Textus Receptus."
  - id: internal
    title: Internal evidence
    body: Ask what a copyist was likely to do. A scribe who knew the quotation starts with Malachi might think “Isaiah” was a mistake.
    question:
      id: mark-1-2-internal
      type: multichoice
      prompt: Which change is a scribe more likely to have made?
      options:
        - text: “in Isaiah the prophet” → “in the prophets”, to avoid naming the wrong prophet.
          correct: true
          feedback: "Right. Metzger and Ehrman: later scribes, sensing a difficulty, replaced “in Isaiah the prophet” with the general statement “in the prophets” (p. 264). This is the “harder reading” rule at work."
        - text: “in the prophets” → “in Isaiah the prophet”, to be more specific.
          feedback: "Unlikely: that change would create a difficulty, not remove one. Scribes removed difficulties more often than they made them."
  - id: weigh
    title: Weigh it up
    body: Put the external and internal evidence together.
    question:
      id: mark-1-2-weigh
      type: multichoice
      prompt: Which reading most likely came first?
      options:
        - text: "“in Isaiah the prophet”: the oldest witnesses have it, and it explains why scribes changed it."
          correct: true
          feedback: Right. Both kinds of evidence point the same way, which is why the UBS text prints this reading.
        - text: "“in the prophets”: more manuscripts have it."
          feedback: "No: number comes last. Many later copies can all go back to one changed ancestor."
        - text: We cannot tell.
          feedback: "Here we can: the age of the witnesses and the scribes’ motive agree."
  - id: decide
    title: Decide for your translation
    body: The UBS text prints “in Isaiah the prophet”. Bibles that follow the Textus Receptus, such as the KJV, have “in the prophets”.
    question:
      id: mark-1-2-decide
      type: multichoice
      prompt: Your regional-language Bible has “in the prophets”. What is the best next step?
      options:
        - text: Take the difference to your Review Committee, recommending the UBS text (“in Isaiah the prophet”) with a footnote.
          correct: true
          feedback: "Right. Your [text policy](~/guide/text-policy/) asks for the UBS text, and for the Review Committee to decide where the regional-language Bible differs. Our recommendation is the UBS reading with a footnote such as: “Some manuscripts read ‘in the prophets’.” The committee makes the decision."
        - text: Print “in the prophets” because it is more accurate.
          feedback: "No: that is exactly the “correction” the scribes made. We translate the earliest text we can reach, not the one we think is more precise."
        - text: Leave out the name and say “as it is written”.
          feedback: "No: that reading is not in the manuscripts. Never change the text to remove a difficulty."
