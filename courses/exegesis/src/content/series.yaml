# Series in this course (ADR 0005). Ids and paths are stable once published.
- id: figures
  title: Figures of speech
  path: learn/figures/
  summary: "One page for each figure of speech a checker meets: what it is, how to spot it, examples from life and from the Bible, how it differs from similar figures, and how translations handle it."
  intro: |
    A figure of speech says something in a way that is not meant literally. The words paint a picture, soften a hard truth, or add force. A reader who takes them literally can miss the point, or get it wrong.

    A checker needs three skills with figures: to **spot** them in the source, to work out what they **mean**, and to judge how the draft **conveys** that meaning in the new language. Start with the first part, then read the figures in any order. The last part brings together the ways translators handle them.
