# Glossary for the Exegesis course, in plain English. Ids are stable once published.
# `source` names where the term and its meaning come from; `checked: false` = not yet checked against it.
# Sources: Katharine Barnwell, Bible Translation: An Introductory Course in Translation Principles, 4th ed. (SIL International, 2020).

# --- Translating and checking ---
- id: exegesis
  term: exegesis
  group: basics
  plain: Finding out what the original author meant, by careful study of the text in its setting. The first step of translating, and of checking. See [When a passage can mean more than one thing](~/guides/more-than-one-meaning/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 11
  checked: true
- id: re-expression
  term: re-expression
  group: basics
  plain: Saying the meaning found by exegesis in the receptor language, clearly and naturally. The second step of translating.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 10 and 12
  checked: true
- id: exegetical-accuracy
  term: exegetical accuracy
  group: basics
  plain: A translation is accurate when it says the same meaning as the original, with nothing added, nothing left out and nothing changed. Being close in form is not the same as being accurate.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 5
  checked: true
- id: addition
  term: addition
  group: basics
  plain: A translation error where the draft says more than the original means.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 5
  checked: true
- id: omission
  term: omission
  group: basics
  plain: A translation error where part of the original meaning is missing from the draft.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 5
  checked: true
- id: change-of-meaning
  term: change of meaning
  group: basics
  plain: A translation error where the draft says something different from what the original means.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 5
  checked: true
- id: back-translation
  term: back translation
  group: basics
  plain: A close translation of a draft back into a language the checker reads, made by someone other than the translator. It shows the checker what the draft says. A problem can be in the draft or only in the back translation.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 18
  checked: true
- id: receptor-language
  term: receptor language
  group: basics
  plain: The language a translation is made into. Also called the target language.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 1
  checked: true
- id: source-text
  term: source text
  group: basics
  plain: The text being translated. The Hebrew, Aramaic and Greek texts are the final authority; versions in other languages are used as helps.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 1 and 3
  checked: true

# --- Finding the meaning ---
- id: sense
  term: sense
  group: meaning
  plain: One of the meanings a word can have. The context shows which sense the author meant.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 21
  checked: true
- id: components-of-meaning
  term: components of meaning
  group: meaning
  plain: The parts that make up a word's meaning. Comparing a word with words close to it shows which parts it has and which it lacks. Also called componential analysis.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 21
  checked: true
- id: unknown-concept
  term: unknown concept
  group: meaning
  plain: Something in the Bible that readers of the translation do not know, such as an animal, a custom or a measure. It can often be said with a short description.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 22
  checked: true
- id: key-biblical-term
  term: key biblical term
  group: meaning
  plain: A word with special importance in the Bible, such as covenant, priest or Messiah. Key terms are studied carefully and translated consistently.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 24
  checked: true
- id: idiom
  term: idiom
  group: meaning
  plain: A fixed group of words whose meaning is not the sum of its words. It looks like a phrase but works like one word. Idioms rarely carry over word for word into another language. See [Idioms](~/learn/figures/idioms/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 4
  checked: true
- id: tear
  term: TEAR
  group: meaning
  plain: "A way to remember four classes of concept: Thing, Event, Attribute (a quality, such as large or quickly) and Relation (how two concepts link, such as because or in)."
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 26
  checked: true
- id: event-idea
  term: event idea
  group: meaning
  plain: An action, process or happening. Greek, Hebrew and English often say an event with a noun, such as "forgiveness"; many languages need a verb, such as "God forgives".
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 26
  checked: true
- id: genitive-construction
  term: genitive construction
  group: meaning
  plain: Two nouns joined so that one depends on the other, as in English "the love of God" or "God's love". The link can mean many different things, so the context must decide.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 27
  checked: true
- id: passive
  term: passive
  group: meaning
  plain: A verb form where the subject is the one the action is done to, as in "John was arrested". The one who acted may not be named. Many languages rarely use the passive, so the actor must be found and named.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 28
  checked: true
- id: implicit-information
  term: implicit information
  group: meaning
  plain: Meaning the author expected the hearers to understand without saying it. A translation may need to state it when its readers would miss it.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 7 and 8
  checked: true
- id: explicit-information
  term: explicit information
  group: meaning
  plain: Meaning that is stated in words.
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 7
  checked: true

# --- Figures of speech and questions ---
- id: figure-of-speech
  term: figure of speech
  group: figures
  plain: A creative use of words that means more than, or other than, the plain words, to catch attention or make a point. Unlike an idiom, it is not a fixed phrase. See [What is a figure of speech?](~/learn/figures/what-is-a-figure/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 33 and 34
  checked: true
- id: simile
  term: simile
  group: figures
  plain: A comparison that says it is a comparison, often with "like" or "as". See [Simile](~/learn/figures/simile/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 33
  checked: true
- id: metaphor
  term: metaphor
  group: figures
  plain: A comparison that does not say it is one, as in "Benjamin is a ravenous wolf". Find the topic, the picture and the point they share. See [Metaphor](~/learn/figures/metaphor/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 33
  checked: true
- id: euphemism
  term: euphemism
  group: figures
  plain: A mild or indirect way of saying something that would sound harsh or rude, such as "fell asleep" for "died". See [Euphemism](~/learn/figures/euphemism/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: litotes
  term: litotes
  group: figures
  plain: Saying something strongly by denying its opposite, as in "not a little comforted" for "greatly comforted". See [Litotes](~/learn/figures/litotes/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: hyperbole
  term: hyperbole
  group: figures
  plain: A deliberate exaggeration for emphasis, not meant to be taken literally. See [Hyperbole](~/learn/figures/hyperbole/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: metonymy
  term: metonymy
  group: figures
  plain: Using a word for something closely linked to what is meant, such as "the sword" for fighting. See [Metonymy](~/learn/figures/metonymy/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: synecdoche
  term: synecdoche
  group: figures
  plain: Using a part for the whole, or the whole for a part, such as "my tongue" for "I". See [Synecdoche](~/learn/figures/synecdoche/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: personification
  term: personification
  group: figures
  plain: Speaking of a thing or an idea as if it were a person. See [Personification](~/learn/figures/personification/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 34
  checked: true
- id: rhetorical-question
  term: rhetorical question
  group: figures
  plain: A question that does not ask for information. It may stress a point, rebuke, express surprise or open a topic. Many languages use such questions differently, so the purpose must be found first. See [Rhetorical questions](~/learn/figures/rhetorical-questions/).
  source: Barnwell, Bible Translation, 4th ed. (SIL International, 2020), ch. 35
  checked: true

# --- How clauses relate (unit 3) ---
# TA = unfoldingWord Translation Academy (CC BY-SA 4.0), https://git.door43.org/unfoldingWord/en_ta, commit 9c88e81.
# SEM = Beekman and Callow, Translating the Word of God (1974), ch. 17–18; Larson, Meaning-Based Translation, 2nd ed. (1998), chapters on propositional relations. Not yet checked.
- id: clause-relation
  term: relation between clauses
  group: relations
  plain: "How two clauses, sentences or longer parts of a text link in meaning: in time, by cause, by purpose, by contrast, and so on. A connecting word such as \"because\" may show it, or the text may leave it unmarked. See [How clauses relate](~/guides/clause-relations/)."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connecting Words and Phrases\""
  checked: true
- id: semantic-structure
  term: semantic structure
  group: relations
  plain: "The meaning of a text set out as a set of simple statements, with the relations between them named. Books on semantic structure give each relation a technical label, such as reason–result."
  source: "John Beekman and John Callow, Translating the Word of God (Zondervan, 1974); Mildred L. Larson, Meaning-Based Translation, 2nd ed. (University Press of America, 1998)"
  checked: false
- id: sequential-time
  term: sequential time
  group: relations
  plain: "One event happens, then the other. Words such as \"then\", \"after\" and \"before\" can show it. The order of telling may differ from the order of happening."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Sequential Time Relationship\""
  checked: true
- id: simultaneous-time
  term: simultaneous time
  group: relations
  plain: "Two or more events happen at the same time, as with \"while\" or \"during\". Neither causes the other. If one does, the relation is reason and result."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Simultaneous Time Relationship\""
  checked: true
- id: background-relation
  term: background
  group: relations
  plain: "An ongoing situation gives the time or setting for a main event, which begins during it. For example, Solomon was old, and during that time he began to worship other gods. The main event is in focus."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Background Information\""
  checked: true
- id: reason-result
  term: reason and result
  group: relations
  plain: "One event causes another. Words such as \"because\", \"so\", \"therefore\" and \"for\" can show it. Languages differ in whether the reason must come first. Books on [semantic structure](~/glossary/#semantic-structure) call it reason–result or cause–effect."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Reason-and-Result Relationship\"; Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: goal-purpose
  term: goal (purpose)
  group: relations
  plain: "Someone does one thing intending that a second thing will happen: \"in order to\", \"so that\". Books on semantic structure call it means–purpose: the action is the means, the intended event is the purpose."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Goal (Purpose) Relationship\"; Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: means-result
  term: means and result
  group: relations
  plain: "One action is the way another is done or achieved: \"By working hard, he passed.\" Greek may state the means with a participle (a verb form, like English \"working\", that adds an action to the main verb)."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: contrast-relation
  term: contrast
  group: relations
  plain: "One event or item stands against another: \"but\", \"yet\", \"although\". Books on semantic structure split this in two. Simple contrast sets two things side by side. Concession–contraexpectation means \"although X, Y\", where X makes us expect the opposite of Y."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Contrast Relationship\"; Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: concession-contraexpectation
  term: concession–contraexpectation
  group: relations
  plain: "A semantic-structure label for \"although X, still Y\": X would lead the hearer to expect the opposite of Y. A kind of contrast."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: hypothetical-condition
  term: hypothetical condition
  group: relations
  plain: "The second event happens only if the first one does: \"if ... then\". Books on semantic structure call all conditions condition–consequence."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Hypothetical Conditions\"; Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: factual-condition
  term: factual condition
  group: relations
  plain: "An \"if\" clause the speaker treats as true. Elijah sets the LORD and Baal side by side in \"if\" clauses, though he himself holds that the LORD is God (1 Kings 18:21). Some languages must say a factual condition as a fact (\"since\"), so that readers do not take it as a doubt."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Factual Conditions\""
  checked: true
- id: contrary-to-fact-condition
  term: contrary-to-fact condition
  group: relations
  plain: "An \"if\" clause the speaker knows is not true, used to make a point. Usually no word shows this. The reader must tell from the context."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Contrary to Fact Conditions\""
  checked: true
- id: exception-relation
  term: exception
  group: relations
  plain: "A clause takes one or more members out of a group: \"except\", \"unless\", \"besides\". In some languages \"no one ... except\" sounds like a contradiction, so it is said with \"only\"."
  source: "unfoldingWord® Translation Academy (CC BY-SA 4.0), \"Connect — Exception Clauses\""
  checked: true
- id: grounds-conclusion
  term: grounds and conclusion
  group: relations
  plain: "A fact is given, and the speaker draws a conclusion from it: \"He is not here, so he must have left.\" Close to reason and result, but the second part is something the speaker concludes, not something the first part caused."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: grounds-exhortation
  term: grounds and exhortation
  group: relations
  plain: "A fact is given, and a command or appeal follows from it, often with \"therefore\". Common in the New Testament letters."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: support-relation
  term: support relations
  group: relations
  plain: "Relations where one part does not move the thought forward but helps another part. Labels in books on semantic structure include restatement, amplification, comment, comparison, illustration and manner."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: head-proposition
  term: head
  group: relations
  plain: "In many pairs or groups of linked clauses, the part that carries the main point. The other parts support it. A draft can go wrong by making a support part sound like the main point."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
- id: support-proposition
  term: support
  group: relations
  plain: "A part that gives the reason, means, time, setting or other help for the head. It matters, but it is not the main point."
  source: "Beekman and Callow; Larson (see semantic structure)"
  checked: false
