id: 1-john-5-7
title: "1 John 5:7–8: the “Johannine comma”"
topic: 1 John 5:7–8
question: The “Johannine comma”
skill: How a sentence entered the Textus Receptus
level: 2
order: 2
minutes: 10
description: "A short guided problem in six steps: how a sentence about the Father, the Word and the Holy Spirit entered the Textus Receptus."
lead: The KJV has a sentence in 1 John 5:7–8 that most modern Bibles do not. Work out where it came from, in the six steps of the worked examples.
sources:
  - id: metzger-ehrman
    cite: Bruce M. Metzger and Bart D. Ehrman, *The Text of the New Testament*, 4th ed. (Oxford University Press, 2005), pp. 146–7, on Erasmus and the Comma Johanneum.
    checked: true
  - id: cntr
    cite: "Manuscript and edition texts: Alan Bunning, Center for New Testament Restoration, transcriptions, CC BY-SA 4.0."
    checked: true
done: You have worked through 1 John 5:7–8 in the same steps the [worked examples](~/guide/examples/) use. Try [another micro module](~/learn/#modules), or read the [list of doubtful passages](~/guide/doubtful-passages/).
steps:
  - id: find
    title: Find the problem
    body: |
      **KJV:** “For there are three that bear record *in heaven, the Father, the Word, and the Holy Ghost: and these three are one. And there are three that bear witness in earth,* the Spirit, and the water, and the blood: and these three agree in one.”

      **Most modern Bibles:** “For there are three that testify: the Spirit and the water and the blood; and the three agree.”
    question:
      id: 1-john-5-7-find
      type: multichoice
      prompt: What is different?
      options:
        - text: The KJV has extra words about three that testify “in heaven” and “in earth”.
          correct: true
          feedback: Right. These extra words are called the “Johannine comma” (here “comma” means a short clause).
        - text: Modern Bibles add the water and the blood.
          feedback: "No: both have the Spirit, the water and the blood."
        - text: Only the word order is different.
          feedback: "No: the KJV has a whole extra clause."
  - id: list
    title: List the readings
    body: Here are the two verses in the CNTR transcriptions of three great codices, and in five printed editions.
    embed:
      name: collation
      args: { passages: [1-john-5-7, 1-john-5-8] }
    question:
      id: 1-john-5-7-list
      type: multichoice
      prompt: "There are two readings: with the comma and without it. Which witnesses here have it?"
      options:
        - text: Only the two Textus Receptus editions (Stephanus 1550 and the KJV’s Greek text).
          correct: true
          feedback: Right. Sinaiticus, Alexandrinus and Vaticanus do not have it, and neither do the Byzantine text (RP), Westcott–Hort or SR.
        - text: The Byzantine text as well.
          feedback: "No: look again at Byz (RP). The comma is not even in the Byzantine majority text."
        - text: Codex Sinaiticus and Codex Vaticanus.
          feedback: "No: both go straight from “three that testify” to “the Spirit and the water and the blood”."
  - id: external
    title: External evidence
    body: |
      The comma is in no early Greek witness here. So how did it reach the Textus Receptus?

      Erasmus printed the first published Greek New Testament in 1516 without these words. He was criticized for leaving them out, and replied that he had found no Greek manuscript that contained them. Later a Greek manuscript with the words was produced, probably written in Oxford about 1520, and Erasmus put the words into his third edition of 1522 (Metzger and Ehrman, pp. 146–7). From there they passed into the Textus Receptus and the KJV. (It is often said that Erasmus promised to add them if one Greek manuscript had them; Metzger and Ehrman note that a specialist found no direct evidence of such a promise.)
    question:
      id: 1-john-5-7-external
      type: multichoice
      prompt: Where did the Greek words in that manuscript most likely come from?
      options:
        - text: From the Latin Vulgate, translated into Greek.
          correct: true
          feedback: Right. Metzger and Ehrman say the scribe took the disputed words from the Latin Vulgate (p. 146). So the Greek evidence for the comma is late and depends on Latin.
        - text: From an early Greek manuscript that Erasmus found later.
          feedback: "No: the manuscript was a recent copy, made about 1520."
        - text: From the Byzantine text.
          feedback: "No: as step 2 showed, the Byzantine text does not have them."
  - id: internal
    title: Internal evidence
    body: Now look at the wording itself. The comma adds an explicit statement about the Father, the Word and the Holy Spirit to a verse about the Spirit, the water and the blood.
    question:
      id: 1-john-5-7-internal
      type: multichoice
      prompt: Which is a copyist more likely to have done?
      options:
        - text: Add the words, to make the meaning fuller and clearer.
          correct: true
          feedback: Right. Scribes added explaining words more often than they removed words (the “shorter reading” rule in the [weighing guide](~/guide/weighing-evidence/)). A copyist is unlikely to drop a clear statement like this on purpose.
        - text: Remove the words, because they were too difficult.
          feedback: "Unlikely: the words are not difficult, and dropping them by accident in every early witness, in every region, is hard to explain."
  - id: weigh
    title: Weigh it up
    body: Put the external and internal evidence together.
    question:
      id: 1-john-5-7-weigh
      type: multichoice
      prompt: Which reading most likely came first?
      options:
        - text: "Without the comma: no early Greek witness has it, it came into Greek late from Latin, and an addition is easier to explain than a removal."
          correct: true
          feedback: Right. Both kinds of evidence agree, which is why the UBS text does not include it.
        - text: "With the comma: it is in the KJV."
          feedback: "No: the KJV follows the Textus Receptus, which took the words from a manuscript of about 1520."
        - text: We cannot tell.
          feedback: "Here we can: the witnesses and the wording point the same way."
  - id: decide
    title: Decide for your translation
    body: The UBS text does not have the comma. Bibles that follow the Textus Receptus do.
    question:
      id: 1-john-5-7-decide
      type: multichoice
      prompt: Your regional-language Bible has the comma, and readers know it. What is the best next step?
      options:
        - text: Take it to your Review Committee, with a recommendation and a footnote either way.
          correct: true
          feedback: "Right. Your [text policy](~/guide/text-policy/) says to follow the regional-language Bible for passages with a long tradition, and the Review Committee decides where it differs from the UBS text. Our recommendation is to follow the UBS text, because no early witness has the comma, with a footnote such as: “A few late manuscripts add: in heaven, the Father, the Word and the Holy Spirit; and these three are one. And there are three that testify on earth.” If the committee keeps the comma, a footnote should say that the earliest manuscripts do not have it. The committee makes the decision."
        - text: Keep the comma because it supports the doctrine of the Trinity.
          feedback: "No: the text policy says never to change the text to fit a theological position. Decide on the evidence."
        - text: Remove it without any note.
          feedback: "Not wise: readers who know the longer form will be confused. A footnote explains the difference."
